name: AI Workers checks
on:
  push:
    paths:
      - "huzlr-workers/**"
      - "huzlr-be/app/models/ai_worker.py"
      - "huzlr-be/app/api/v1/endpoints/ai_workers.py"
      - "huzlr-be/app/services/ai_worker_runtime.py"
      - "huzlr-be/app/ai_worker.py"
      - "huzlr-be/alembic/versions/*ai_workers*"
      - "huzlr/app/(app)/ai-workers/**"
      - "huzlr/services/aiWorkersApi.ts"
      - ".github/workflows/ai-workers.yml"
  pull_request:
    paths:
      - "huzlr-workers/**"
      - "huzlr-be/app/models/ai_worker.py"
      - "huzlr-be/app/api/v1/endpoints/ai_workers.py"
      - "huzlr-be/app/services/ai_worker_runtime.py"
      - "huzlr-be/app/ai_worker.py"
      - "huzlr-be/alembic/versions/*ai_workers*"
      - "huzlr/app/(app)/ai-workers/**"
      - "huzlr/services/aiWorkersApi.ts"
      - ".github/workflows/ai-workers.yml"
jobs:
  runtime-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
        working-directory: huzlr-workers
      - run: PYTHONPATH=. python -m unittest discover -s tests -v
        working-directory: huzlr-workers
      - run: python -m compileall -q huzlr-be/app/models/ai_worker.py huzlr-be/app/api/v1/endpoints/ai_workers.py huzlr-be/app/services/ai_worker_runtime.py huzlr-be/app/ai_worker.py huzlr-be/alembic/versions/f1a2b3c4d5e6_ai_workers_runtime.py

  frontend-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: huzlr/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: huzlr
      - run: pnpm exec tsc --noEmit
        working-directory: huzlr
