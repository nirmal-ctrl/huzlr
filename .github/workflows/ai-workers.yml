name: AI Workers checks
on:
  push:
    paths:
      - "huzlr-workers/**"
      - "huzlr-be/app/models/ai_worker.py"
      - "huzlr-be/app/api/v1/endpoints/ai_workers.py"
      - ".github/workflows/ai-workers.yml"
  pull_request:
    paths:
      - "huzlr-workers/**"
      - "huzlr-be/app/models/ai_worker.py"
      - "huzlr-be/app/api/v1/endpoints/ai_workers.py"
      - ".github/workflows/ai-workers.yml"
jobs:
  runtime-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "pydantic>=2,<3"
      - run: PYTHONPATH=. python -m unittest discover -s tests -v
        working-directory: huzlr-workers
      - run: python -m compileall -q huzlr-be/app/models/ai_worker.py huzlr-be/app/api/v1/endpoints/ai_workers.py
