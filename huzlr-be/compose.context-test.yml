# Isolated, disposable integration services. No host database credentials are used.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: context_test
      POSTGRES_PASSWORD: context_test_only
      POSTGRES_DB: context_test
    ports:
      - "127.0.0.1:55439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U context_test -d context_test"]
      interval: 2s
      timeout: 5s
      retries: 30
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/context_test_only
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:57689:7687"
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "context_test_only", "RETURN 1"]
      interval: 5s
      timeout: 10s
      retries: 30
